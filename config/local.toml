# Lore Server overlay config. Layered on top of (in order):
#   compiled-in default.toml -> /etc/lore/config/default.toml -> docker.toml (LORE_ENV=docker) -> this file -> LORE__* env vars
# Reference: https://epicgames.github.io/lore/reference/lore-server-config/
#
# docker.toml in the image already sets both store paths to /data; they are
# repeated here so this file is the single readable source of truth.

# --- TLS ---------------------------------------------------------------------
# Clients using lores:// verify the certificate on BOTH transports:
#   QUIC (UDP 41337) and gRPC over HTTPS (TCP 41337).
# So both endpoints get the Let's Encrypt cert. Without the gRPC block a
# lores:// client would try TLS against a plaintext gRPC listener.

[server.quic.certificate]
cert_file = "/etc/lore/certs/fullchain.pem"
pkey_file = "/etc/lore/certs/privkey.pem"

[server.grpc.certificate]
cert_file = "/etc/lore/certs/fullchain.pem"
pkey_file = "/etc/lore/certs/privkey.pem"

# --- Storage -----------------------------------------------------------------

[immutable_store.local]
path = "/data"
flush_delay_seconds = 10

[mutable_store.local]
path = "/data"
flush_delay_seconds = 10

# --- Logging -----------------------------------------------------------------

[telemetry.logger]
format = "json"
output = "stdout"

# --- Authentication: Auth0 (DISABLED until you uncomment) -------------------
# With no [server.auth] table the server accepts UNAUTHENTICATED requests:
# anyone who can reach port 41337 can list, clone and push every repository.
#
# To enable Auth0, follow docs/AUTH0.md, then uncomment the block below and
# replace the three <...> values. The server needs outbound HTTPS to your
# tenant to fetch its signing keys (OIDC discovery on jwt_issuer).
#
# [server.auth]
# # Exactly as Auth0 issues it — the trailing slash is required.
# jwt_issuer   = "https://<TENANT>.auth0.com/"
# # The Identifier of the Auth0 API you created (not the app's Client ID).
# jwt_audience = ["<API_IDENTIFIER>"]
# # Auth0 RBAC writes the user's role permissions to a top-level "permissions"
# # array: read, write, admin, obliterate.
# permission_claim = "permissions"
# # Default is ["write"] for every token holder. Empty = a logged-in user with
# # no Auth0 role gets read only.
# implicit_actions = []
#
# [server.auth.oidc]
# # Client ID of the Auth0 Native application `lore login` signs in with.
# client_id = "<NATIVE_APP_CLIENT_ID>"
# scopes    = ["openid", "profile", "offline_access"]
